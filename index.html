<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <title>Monkey Got Thumbs — get comfortable with AI</title>
    <link rel="canonical" href="https://monkey-got-thumbs.com/">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#0E0B1A" />
    <meta name="color-scheme" content="dark">
    <!-- Preload the LCP hero (responsive) so it's discovered before the stylesheets parse -->
    <link rel="preload" as="image" type="image/webp" imagesrcset="/hero-400.webp 400w, /hero.webp 800w" imagesizes="(max-width: 571px) 61vw, 350px" fetchpriority="high">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <meta name="description" content="Monkey Got Thumbs helps everyday people get comfortable with AI and make little agents of their own — no coding, no jargon, at your own pace, with a friendly community alongside you." />
    <meta name="author" content="Monkey Got Thumbs" />
    <meta property="og:title" content="Monkey Got Thumbs — get comfortable with AI">
    <meta property="og:description" content="Get comfortable with AI and make little agents of your own — no coding, no jargon, at your own pace, with a friendly community alongside you.">
    <meta property="og:url" content="https://monkey-got-thumbs.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Monkey Got Thumbs">
    <meta property="og:locale" content="en_GB">
    <meta property="og:image" content="https://monkey-got-thumbs.com/social-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="Monkey Got Thumbs — a friendly monkey, thumbs up, on a dark background">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <script type="application/ld+json">{
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Monkey Got Thumbs",
        "url": "https://monkey-got-thumbs.com/",
        "description": "Monkey Got Thumbs helps everyday people get comfortable with AI and make little agents of their own — no coding, no jargon, at your own pace, with a friendly community alongside you.",
        "publisher": { "@type": "Organization", "name": "Monkey Got Thumbs", "logo": { "@type": "ImageObject", "url": "https://monkey-got-thumbs.com/logo.png", "width": 200, "height": 300 } }
    }</script>
    <style>
        /* ===== Calm, warm backdrop — soft glows instead of flat black ===== */
        body {
            background:
                radial-gradient(60rem 40rem at 78% -8%, color-mix(in srgb, var(--color-brand) 26%, transparent), transparent 70%),
                radial-gradient(48rem 36rem at 8% 14%, color-mix(in srgb, var(--color-accent) 9%, transparent), transparent 68%),
                var(--color-bg);
            background-attachment: fixed;
        }

        /* The monkey is the first thing you should see — keep the page's own top space small.
           Overrides layout.css `main { margin-block: clamp(2rem, 4vw, 4rem) }` on the homepage only. */
        main { margin-block-start: clamp(0.5rem, 1.5vw, 1.25rem); margin-block-end: clamp(1rem, 2vw, 1.75rem); }

        /* Generous, restful vertical rhythm — one idea at a time */
        .home-section { padding-block: clamp(3rem, 8vw, 6.5rem); }
        .home-section:not(.hero) { max-width: var(--content-col); margin-inline: auto; }
        .home-lede { max-width: 38rem; margin-inline: auto; text-align: center; color: var(--color-fg-secondary); font-size: var(--font-size-lg); line-height: 1.75; }

        /* ===== Hero — states the purpose, nothing to decide ===== */
        /* margin-top: 0 beats layout.css `section.hero { margin: 2rem 0 2.5rem }`; the art carries
           its own optical breathing room, so it doesn't need stacked padding above it as well. */
        .hero { text-align: center; padding-top: 0; margin-top: 0; }
        /* The hero is now the page's only section, so the between-sections spacing that layout.css
           gives it (`.home-section.hero`, 0,2,0) is orphaned trailing space above the footer. */
        .home-section.hero { padding-bottom: clamp(1rem, 2vw, 1.5rem); margin-bottom: 0; }
        /* The art is now cropped tight to the monkey (was floating in ~19% dead canvas), so the box
           is sized to the artwork itself — 350px keeps the monkey the same size it rendered before,
           rather than growing it by the padding we just removed. Overrides layout.css min(400px,70vw). */
        /* `.home-section.hero img` (0,2,1) is needed to beat layout.css's `section.hero img` (0,1,2) —
           a plain `.hero img` loses on specificity no matter that this block is loaded later. */
        .home-section.hero img { width: min(350px, 61vw); height: auto; margin-inline: auto; display: block; animation: floatIn 800ms ease-out both; }

        /* ===== Hero layout — question · monkey · question, button under the monkey ===== */
        .hero-grid { display: grid; justify-items: center; align-items: center; row-gap: var(--space-lg);
                     grid-template-columns: minmax(0, 1fr);
                     grid-template-areas: "art" "why" "what" "cta"; }
        .hero-ask--why  { grid-area: why; }
        .hero-ask--what { grid-area: what; }
        .hero-art       { grid-area: art; display: block; }
        .hero-cta       { grid-area: cta; }

        @media (min-width: 62rem) {
            .hero-grid {
                /* the side columns are equal, so the monkey stays optically centred on the page */
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
                grid-template-areas: "why art what"
                                     ".   cta .   ";
                column-gap: clamp(1.5rem, 4vw, 3.5rem);
            }
        }

        /* the two questions read as a matched pair — same display face, accent and size */
        .hero-ask h1, .hero-ask h2 { font-family: var(--font-display); color: var(--color-accent);
                                     letter-spacing: var(--letter-spacing-wide);
                                     font-size: clamp(1.45rem, 2.5vw, 2.1rem); line-height: 1.05;
                                     margin: 0 0 var(--space-sm); text-wrap: balance; }
        /* Both answers: same size and measure so neither question outweighs the other. The second is
           bolder because it is the proposition, not just an answer. */
        .hero .home-lede { font-size: clamp(1rem, 1.25vw, 1.15rem); max-width: 20rem; line-height: 1.5; margin: 0 auto; }
        .hero-statement { text-align: center; font-weight: 700; color: var(--color-fg);
                          font-size: clamp(1.05rem, 1.4vw, 1.25rem); line-height: 1.35;
                          letter-spacing: -0.01em; max-width: 24rem; margin: 0 auto; text-wrap: pretty; }
        .hero-cta { margin-top: var(--space-md); display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }
        .hero-cta .btn { font-size: var(--font-size-lg); padding-inline: 1.6rem; }
        .hero-cta small { color: var(--color-muted); font-size: var(--font-size-sm); }
        /* transform-only — never opacity:0 on the LCP hero image, so it paints immediately */
        @keyframes floatIn { from { transform: translateY(18px); } to { transform: translateY(0); } }

        /* The four door-cards lived here. Removed: the homepage now asks one question and offers
           one way in (`Begin your journey` → /begin/), so there is nothing to choose between.
           The four sections are still reachable from the nav. */
    </style>
    <link rel="stylesheet" href="/assets/css/accessibility.css">
    <script src="/assets/js/a11y-init.js"></script>
    <script src="/assets/js/accessibility.js" defer></script>
    <link rel="stylesheet" href="/assets/css/journey.css">
    <script src="/assets/js/journey.js" defer></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <mgt-header></mgt-header>
    <main id="main-content">

        <!-- HERO: state the purpose -->
        <section class="home-section hero" aria-labelledby="hero-title">
            <!-- Grid areas place these visually (question | monkey | question), so the DOM keeps a
                 sensible reading order for screen readers and for no-CSS: both asks, art, button. -->
            <div class="hero-grid">
                <div class="hero-ask hero-ask--why">
                    <h1 id="hero-title" data-a11y="hero-title">Why are you here?</h1>
                    <p class="home-lede" data-a11y="hero-lede">Because you know there's more</p>
                </div>
                <div class="hero-ask hero-ask--what">
                    <h2 data-a11y="hero-title2">What's in it for you?</h2>
                    <p class="hero-statement" data-a11y="hero-statement">Expand what you can do — a little further each day</p>
                </div>
                <picture class="hero-art">
                    <source type="image/webp" srcset="/hero-400.webp 400w, /hero.webp 800w" sizes="(max-width: 571px) 61vw, 350px">
                    <img src="/hero.png" srcset="/hero-400.png 400w, /hero.png 800w" sizes="(max-width: 571px) 61vw, 350px" alt="Monkey Got Thumbs — a friendly monkey, thumbs up, on a dark background" width="800" height="880" loading="eager" decoding="async" fetchpriority="high">
                </picture>
                <div class="hero-cta">
                    <a class="btn" href="/begin/">Begin your journey</a>
                    <small>No sign-up. No jargon. No assumption you know a thing.</small>
                </div>
            </div>
        </section>

    </main>
    <mgt-footer></mgt-footer>
    <script src="/assets/js/tracking.js" defer></script>
    <script type="module" src="/assets/js/app.js"></script>
    <script type="module" src="/components/core/mgt-header.js"></script>
    <script type="module" src="/components/core/mgt-footer.js"></script>
</body>
</html>
